name: LOF溢价监控

on:
  workflow_dispatch:
  repository_dispatch:
    types: [manual_trigger]

permissions:
  contents: write

jobs:
  alert:
    if: github.event.schedule == '30 3 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 盘中预警
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python main.py --alert

  daily:
    if: github.event.schedule == '30 6 * * 1-5' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 每日汇总+生成看板
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python main.py --daily && python generate_dashboard.py

      - name: 提交历史数据和看板
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "自动更新历史数据和看板 $(date '+%Y-%m-%d %H:%M')"
          git push
